<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="editor.title" domain="image_workbench.messages" /></h1>

    <f:be.infobox
        title="{f:translate(key: 'unavailable.title', domain: 'image_workbench.messages')}"
        state="{f:constant(name: 'TYPO3\CMS\Core\Type\ContextualFeedbackSeverity::WARNING')}"
    >
        <p><f:translate key="{reason}" domain="image_workbench.messages" /></p>
    </f:be.infobox>
</f:section>

</html>
