name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: Audit dependencies
        run: composer audit
      - name: PHP syntax
        run: find Classes Configuration Tests ext_emconf.php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XLIFF well-formed
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null
          xmllint --noout Resources/Private/Language/*.xlf

  cgl:
    name: Coding standards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer ci:cgl -- --dry-run

  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          ini-values: memory_limit=1G
      - run: composer install --no-progress --no-interaction
      - run: composer ci:phpstan

  unit:
    name: Unit tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer ci:tests:unit

  functional:
    name: Functional tests (PHP ${{ matrix.php-version }}, MariaDB)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: typo3_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      typo3DatabaseDriver: mysqli
      typo3DatabaseName: typo3_ci
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: 3306
      typo3DatabaseUsername: root
      typo3DatabasePassword: root
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, intl, mysqli
          coverage: none
      - run: composer install --no-progress --no-interaction
      - run: composer ci:tests:functional

  assets:
    name: Editor bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Build/package-lock.json
      - name: Install asset toolchain
        run: npm ci
        working-directory: Build
      - name: Rebuild the editor bundle (fails when the editor labels drift from the XLIFF file)
        run: npm run build
        working-directory: Build
      - name: The committed bundle must match the rebuilt one
        run: git diff --exit-code --stat -- Resources/Public/JavaScript/Vendor
